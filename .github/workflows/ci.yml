# CI TrailSeal
#
# TIDAK ADA RAHASIA DI SINI. Tanpa TRAILSEAL_TEST_POSTGRES_URL, test yang
# butuh Postgres akan melewati dirinya sendiri (lihat app_test.go), dan
# tanpa SENTRY_DSN error tracking jadi no-op. Itu disengaja: CI yang butuh
# kredensial produksi adalah CI yang tidak bisa dijalankan dari fork, dan
# satu kebocoran log berarti memutar ulang semua kunci.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # -short melewati TestRateLimiter_Returns429_Real (1005 request,
      # ~1 menit). Ia tetap jalan di mesin lokal lewat perintah verify
      # biasa; di CI ia hanya memperlambat umpan balik.
      - name: go test
        run: go test -short -p 1 ./... -count=1

      # gofmt dicek SETELAH test: kegagalan format tidak boleh menyembunyikan
      # kegagalan yang sebenarnya penting.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^lib/target/' || true)
          if [ -n "$unformatted" ]; then
            echo "Berkas belum diformat:"
            echo "$unformatted"
            exit 1
          fi

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # govulncheck hanya melaporkan kerentanan pada kode yang BENAR-BENAR
      # dipanggil, bukan setiap CVE di go.sum. Temuannya sedikit dan nyata,
      # jadi layak memutus build.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: govulncheck
        run: govulncheck ./...
