services:
  postgres:
    image: postgres:16-alpine
    container_name: trailseal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trailseal
      POSTGRES_PASSWORD: trailseal_dev_password
      POSTGRES_DB: trailseal
    ports:
      - "5432:5432"
    volumes:
      - trailseal_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailseal -d trailseal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  trailseal_pg_data:
